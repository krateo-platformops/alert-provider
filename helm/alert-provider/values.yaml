# The controller image. tag defaults to the chart appVersion (= release tag), so chart and
# image move together; override to pin.
image:
  repository: ghcr.io/krateo-platformops/alert-provider
  tag: ""
# Pull credentials for the image, on the krateo-alert-provider ServiceAccount (so the Deployment
# and the hyperdx-key-bootstrap Job both use them). The image is private: the Krateo installer wires
# this from registryAuth. e.g. [{name: krateo-registry-image-pull}]
imagePullSecrets: []

config:
  # A2A endpoint of the agent the webhook calls for root-cause analysis. Default = incident-agent
  # (has the k8s/Helm/ClickHouse read tools an RCA needs; autopilot has neither). In-cluster kagent
  # A2A Service, named after the Agent's metadata.name -> incident-agent.<namespace>.svc:8080.
  autopilotA2aUrl: http://incident-agent.krateo-system.svc:8080/
  # kagent ModelConfig, in the release namespace, whose model judges which open incident of a
  # firing alert covers the alert's current records (internal/compare): one chat-completions call per
  # firing, no agent. Provider OpenAI (its baseUrl; with apiKeyPassthrough the key is the service
  # JWT) or Gemini. A firing no open incident covers opens a new incident.
  compareModelConfig: gemini-flash
  # How many of an alert's newest open, analyzed incidents one comparison weighs. An older one
  # can still take a firing as unanalyzed, never through the comparison. Each adds up to ~5.5k
  # characters (its root cause and three scripts) to the prompt.
  maxCompareCandidates: 50
  # How long an open, analyzed incident keeps covering its alert's firings after it opened or last
  # covered one (a Go duration: 90m, 24h). Past it the incident is stale: no comparison weighs it,
  # so a firing it would have covered opens a new incident with a fresh RCA, which names it in the
  # observability.krateo.io/supersedes-stale annotation. A covering firing stamps
  # observability.krateo.io/last-covered-at on its incident, so a problem that keeps firing stays
  # covered. "0" disables it: every open incident is compared, however old.
  incidentCoverWindow: 24h
  # Seconds an incident whose RCA failed keeps taking its alert's firings, counted from the
  # failure. A failed analysis is closed (observability.krateo.io/closed-reason: analysis-failed),
  # never left Open with nothing to check. Past the hold, a firing nothing else covers opens a new
  # incident with a fresh RCA, which names it in observability.krateo.io/supersedes-failed.
  failedAnalysisHold: 1800
  # How many more times an RCA that failed transiently runs: the call failed (a timeout, a 5xx,
  # a cut stream), the answer was empty, or it was only the model's error. The incident stays
  # Analyzing meanwhile.
  analysisRetries: 2
  # Seconds before the first retry; each next retry waits twice as long.
  analysisRetryDelay: 120
  # Intra-service auth (Option A). Base URL of the authn service. When set, the handler exchanges its
  # projected SA token (audience "authn") at <authnUrl>/serviceaccount/login for a Krateo JWT and
  # presents it on the A2A calls (the RCA and the comparisons), so the gated agents accept them; a
  # serviceaccount.authn.krateo.io ServiceAccount mapping CR is also rendered. Requires authn's
  # serviceaccount strategy. Empty (default) DISABLES it — unauthenticated A2A, exactly as before
  # (safe on older clusters with no gateway). Enable in-cluster with: http://authn.krateo-system.svc
  authnUrl: ""
  # HyperDX v2 external API the reconciler pushes Alert CRs to (Bearer auth via hyperdx-api-token).
  # Default = the krateo-clickstack-api Service the observability stack exposes.
  hyperdxApiUrl: http://krateo-clickstack-api.krateo-system.svc:8000
  # How often (seconds) the reconciler pushes Alert CRs to HyperDX and mirrors their state. Each
  # pass that finds an alert ALERT is one firing of it.
  reconcileInterval: 60
  # Alert CRs the reconciler seeds into its namespace on start when they are absent (rendered to
  # DEFAULT_ALERTS_JSON; `${NAMESPACE}` is substituted with the release namespace). None by default:
  # the platform's default alert set ships in krateo-observability, tuned there, and a second set here
  # would duplicate it, each firing launching its own incident-agent RCA. Seeding never updates or
  # deletes an Alert, so turning this off leaves earlier seeded copies in place to be removed by hand.
  # examples/alerts/default-alerts.yaml keeps the three this chart used to seed, as a reference.
  defaultAlerts: []

# OpenTelemetry tracing (internal/tracing). Off by default: with enabled false no OTEL_* variable
# renders and the binary registers no tracer, so the pod is exactly as before. On, the provider
# exports spans over OTLP/HTTP to the node-local collector agent at http://$(HOST_IP):4318: one
# trace per Alert reconcile (provider-runtime's reconcile, its connect/observe/update/delete children
# and the HyperDX calls), incident.fire/compare/analyze/reanalyze with the model and A2A calls, and
# the webhook's POSTs. Only the Deployment gets these variables: the hyperdx-key-bootstrap Job's pod
# template is immutable within a release, so toggling this must not change it.
otel:
  enabled: false
  # OTEL_TRACES_SAMPLER, read by the SDK. parentbased_always_on keeps every root (each reconcile,
  # each webhook POST without a traceparent) and follows an inbound parent's decision otherwise.
  tracesSampler: parentbased_always_on
  # OTEL_SERVICE_NAME: service.name on every span.
  serviceName: krateo-alert-provider
