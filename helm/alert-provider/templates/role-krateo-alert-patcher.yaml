{{- /*
krateo-alert-patcher: `patch` on Alerts in this release's namespace, and nothing else. Approving a
remediation in the portal patches the Alert with the signed-in user's token. Rendered only when
alertPatcherGroups lists a group; the binding names exactly those groups. Namespaced on purpose:
Alerts in tenant namespaces stay out of reach.
*/ -}}
{{- with .Values.alertPatcherGroups }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krateo-alert-patcher
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: ["observability.krateo.io"]
    resources: ["alerts"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krateo-alert-patcher
  namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krateo-alert-patcher
subjects:
{{- range . }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . | quote }}
{{- end }}
{{- end }}
