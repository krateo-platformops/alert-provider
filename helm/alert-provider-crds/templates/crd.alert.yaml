# Alert (alerts.observability.krateo.io) — desired HyperDX alert, reconciled by krateo-alert-provider
# (a provider-runtime controller; apis/alert/v1alpha1 holds its Go types, crd_test.go this schema to them).
# spec = what to alert on; status mirrors the live HyperDX alert state.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: alerts.observability.krateo.io
spec:
  group: observability.krateo.io
  scope: Namespaced
  names:
    kind: Alert
    listKind: AlertList
    plural: alerts
    singular: alert
    categories: [krateo, observability]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Interval
          type: string
          jsonPath: .spec.interval
        - name: Threshold
          type: number
          jsonPath: .spec.threshold
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [interval, threshold, thresholdType]
              # One source per Alert: it counts log rows (where) or aggregates a metric (metricRef),
              # never both. Enforced at admission rather than discovered at evaluation.
              x-kubernetes-validations:
                - rule: "!has(self.metricRef) || self.where == ''"
                  message: "metricRef and where are mutually exclusive: an Alert counts log rows (where) or aggregates a metric (metricRef), never both"
                - rule: "has(self.aggregation) == (has(self.metricRef) || has(self.value))"
                  message: "aggregation is required with metricRef or value, and only valid with one of them"
                - rule: "!(has(self.metricRef) && has(self.value))"
                  message: "value is read from log rows; a metric alert (metricRef) aggregates the metric itself"
                - rule: "!has(self.aggregation) || self.aggregation != 'increase' || has(self.metricRef)"
                  message: "aggregation 'increase' is a counter metric's; it requires metricRef"
                - rule: "!has(self.labels) || has(self.metricRef)"
                  message: "labels filter a metric's points; they require metricRef"
                - rule: "has(self.thresholdMax) == (has(self.thresholdType) && self.thresholdType in ['between', 'not_between'])"
                  message: "thresholdMax is the upper bound of a range: required with thresholdType between or not_between, and only valid with them"
                - rule: "!has(self.thresholdMax) || double(self.thresholdMax) >= double(self.threshold)"
                  message: "thresholdMax must be at least threshold: the range is [threshold, thresholdMax]"
                - rule: "!has(self.ratio) || has(self.metricRef)"
                  message: "ratio divides two totals of a metric; it requires metricRef"
                - rule: "!has(self.ratio) || (has(self.aggregation) && self.aggregation in ['sum', 'increase'])"
                  message: "ratio divides two totals: aggregation must be sum or increase"
                - rule: "!has(self.source) || !has(self.metricRef)"
                  message: "source names the rows where reads (logs or traces); a metric alert (metricRef) reads its metric"
                - rule: "!has(self.source) || self.source != 'traces' || self.where != ''"
                  message: "a traces alert needs a where: counting every span measures traffic, not a fault"
                - rule: "!has(self.groupBy) || has(self.metricRef)"
                  message: "groupBy splits a metric's series; it requires metricRef"
                - rule: "!has(self.groupBy) || !has(self.ratio)"
                  message: "groupBy and ratio are mutually exclusive: a grouped ratio would need both its totals grouped alike"
              properties:
                displayName:
                  type: string
                  description: >
                    Human-readable name, shown in the portal and in the RCA prompt (defaults to
                    metadata.name). It need not be unique: the HyperDX alert is named after
                    metadata.name, which its webhook carries back to identify this CR.
                source:
                  type: string
                  enum: [logs, traces]
                  description: >
                    Which rows where and value read: the HyperDX logs source (logs, the default when
                    omitted) or its traces source (traces, one row per span, with columns such as
                    ServiceName, SpanName, StatusCode, StatusMessage, Duration and SpanAttributes).
                    Row alerts only: refused with metricRef. A traces alert needs a non-empty where.
                where:
                  type: string
                  default: ""
                  description: >
                    ClickHouse SQL boolean expression over the rows of source counted by the alert
                    (empty = all rows). The controller pins whereLanguage:"sql" on the tile, and the
                    expression reaches the query's WHERE clause verbatim. In the logs source,
                    severity travels in the text rather than in a severity column, so predicates
                    read off Body and, for Kubernetes events, the JSON inside it — e.g.
                    ResourceAttributes['telemetry.source'] = 'k8s-events' AND
                    JSONExtractString(Body, 'object', 'reason') = 'BackOff'. In the traces source,
                    predicates read the span — e.g. ServiceName = 'snowplow' AND StatusCode =
                    'Error'.
                metricRef:
                  type: object
                  required: [name]
                  description: >
                    The Metric (metrics.observability.krateo.io), in the Alert's namespace, the
                    alert aggregates over the metrics source, instead of counting log rows.
                    Mutually exclusive with a non-empty where; requires aggregation. A reference to
                    a Metric that does not exist is refused with phase: Invalid.
                  properties:
                    name:
                      type: string
                      minLength: 1
                aggregation:
                  type: string
                  enum: [avg, max, min, sum, p95, increase]
                  description: >
                    How the points over the interval become the value compared with the threshold:
                    the metric's (metricRef), or value's per log row. 'increase' is a counter's (a
                    sum metric's) increase over the interval, with counter resets clamped so a
                    restart neither spikes nor goes negative; it is metric-only and refused on any
                    other metric type.
                value:
                  type: string
                  description: >
                    A ClickHouse SQL expression read from each row (of source) that where matches,
                    aggregated by aggregation instead of counting the rows — e.g. a cost extracted
                    from a log row's Body:
                    toFloat64OrZero(extract(Body, 'agw\\.ai\\.usage\\.cost\\.total=([0-9.]+)')),
                    or a span's duration in milliseconds: Duration / 1e6.
                    Requires aggregation (avg, max, min, sum or p95). Row alerts only.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  x-kubernetes-validations:
                    - rule: "self.all(k, k.matches('^[A-Za-z0-9_./-]+$'))"
                      message: "label keys are attribute names: letters, digits, '_', '.', '-', '/'"
                  description: >
                    Keep only the metric points that carry these values, on the point or on its
                    resource, e.g. {tenant: acme}; ANDed together. Metric alerts only. With ratio,
                    these select the numerator.
                ratio:
                  type: object
                  description: >
                    Compare a share instead of one total: the aggregation of the points labels
                    keep (the numerator) divided by the aggregation of the points ratio.labels
                    keep (the denominator), both from the metric, over the interval. E.g. the
                    failing share of API requests: labels {krateo.sli.error: "true"},
                    ratio.labels {service.name: snowplow}, threshold 0.01 above. HyperDX evaluates
                    a window with no traffic as 0, so a ratio whose condition holds at 0 (e.g. a
                    success share 'below 0.99') would fire whenever the service is idle; such an
                    Alert is refused (phase Invalid). Metric alerts with aggregation sum or
                    increase only.
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      x-kubernetes-validations:
                        - rule: "self.all(k, k.matches('^[A-Za-z0-9_./-]+$'))"
                          message: "label keys are attribute names: letters, digits, '_', '.', '-', '/'"
                      description: The denominator's points, ANDed; empty keeps every point of the metric.
                interval:
                  type: string
                  enum: ["1m", "5m", "15m", "30m", "1h", "6h", "12h", "1d"]
                  default: "5m"
                  description: Evaluation window.
                threshold:
                  type: number
                  description: >
                    Trigger value compared via thresholdType. For a log alert (where) the value is
                    a COUNT of rows over the window, so it is never negative — which makes some
                    pairings decided before any data is read and rejected by the controller with
                    phase: Invalid: 'above 0' (value >= 0) fires on every evaluation including an
                    empty result, and 'below 0' (value < 0) can never fire at all. Use 1 with
                    'above' for "at least one", and 1 with 'below' for "none in this window". For an
                    aggregated alert (metricRef, or value) the compared value is the aggregation
                    over the window, in its own unit, and any threshold is accepted.
                thresholdType:
                  type: string
                  enum: [above, below, above_exclusive, below_or_equal, equal, not_equal, between, not_between]
                  default: above
                  description: >
                    How the value is compared with threshold (HyperDX's doesExceedThreshold): above
                    is value >= threshold, above_exclusive >, below <, below_or_equal <=, equal ==,
                    not_equal !=; between fires on threshold <= value <= thresholdMax, not_between
                    outside that range.
                thresholdMax:
                  type: number
                  description: >
                    The upper bound of the range for thresholdType between and not_between
                    (required with them, refused otherwise); at least threshold.
                message:
                  type: string
                  description: >
                    Notification message (markdown). With groupBy, the message pushed to HyperDX
                    ends with a line "Group: " and HyperDX's group template variable, which it fills
                    with the firing series; this field keeps what was written.
                groupBy:
                  type: array
                  minItems: 1
                  maxItems: 5
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: '^[A-Za-z0-9_./-]+$'
                  description: >
                    Evaluate one series per distinct value of these attribute keys, e.g.
                    [k8s.namespace.name, k8s.pod.name, k8s.container.name]: one unhealthy container
                    fires however many healthy ones there are. Each key is read off the metric
                    point, or off its resource when the point lacks it, as labels match. HyperDX
                    evaluates each series on its own, counts consecutiveWindows per series, and
                    resolves a series on one interval within the threshold; a series that stops
                    reporting is never resolved by HyperDX, so status.groups (computed by the
                    provider) is the per-series truth. Metric alerts only; refused with ratio.
                consecutiveWindows:
                  type: integer
                  minimum: 1
                  maximum: 60
                  description: >
                    Fire only once the condition has held for this many consecutive intervals (1
                    when omitted); HyperDX counts them per group with groupBy. An interval with no
                    data restarts the count, and one interval within the threshold resolves.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: Conditions of the reconcile (Ready, Synced), written by provider-runtime.
                  items:
                    type: object
                    required: [lastTransitionTime, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                hyperdxAlertId:
                  type: string
                hyperdxDashboardId:
                  type: string
                state:
                  type: string
                  description: Live HyperDX alert state (OK / ALERT / PENDING).
                okSince:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    When the alert last turned OK; unset while state is anything but OK. Written
                    by the loop that writes state, for display only: it never closes an incident.
                phase:
                  type: string
                  description: >
                    Reconcile phase. Pending (no HyperDX alert yet) / Invalid (the threshold can only
                    have one outcome — see threshold — or the metricRef names no Metric, or its
                    aggregation cannot apply to the Metric's type) / Synced (the CR's spec IS the
                    live alert) / SpecDrift (the spec could not be pushed — the live alert does
                    NOT match this CR) / Error.
                error:
                  type: string
                groups:
                  type: array
                  description: >
                    With groupBy: the series that are ALERT, computed by the provider each pass from
                    the last consecutiveWindows completed intervals (a series is listed only when
                    every one of them has a value that breaches the threshold). A series that
                    recovers or stops reporting drops out. Sorted by group; at most 50, the rest
                    counted in groupsTruncated. Left as it was when the query fails.
                  items:
                    type: object
                    required: [group, value, since]
                    properties:
                      group:
                        type: object
                        additionalProperties:
                          type: string
                        description: The series' value of each groupBy key.
                      value:
                        type: number
                        description: The series' value in the last completed interval.
                      since:
                        type: string
                        format: date-time
                        description: >
                          When the series started breaching: the start of the earliest breaching
                          interval, kept while the series stays listed.
                groupsTruncated:
                  type: integer
                  description: ALERT series left out of groups past its 50 entries.
