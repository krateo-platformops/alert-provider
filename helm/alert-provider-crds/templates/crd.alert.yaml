# Alert (alerts.observability.krateo.io) — desired HyperDX alert, reconciled by krateo-alert-provider
# (a provider-runtime controller; apis/alert/v1alpha1 holds its Go types, crd_test.go this schema to them).
# spec = what to alert on; status mirrors the live HyperDX alert state.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: alerts.observability.krateo.io
spec:
  group: observability.krateo.io
  scope: Namespaced
  names:
    kind: Alert
    listKind: AlertList
    plural: alerts
    singular: alert
    categories: [krateo, observability]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Type
          type: string
          jsonPath: .status.type
        - name: Incidents
          type: string
          description: Whether a firing opens an incident (the OpensIncidents condition).
          jsonPath: .status.conditions[?(@.type=="OpensIncidents")].status
        - name: Observed
          type: date
          description: When the provider last read the live HyperDX state (status.stateObservedAt). Older than a few poll intervals means the provider is not evaluating this Alert, whatever Ready says.
          jsonPath: .status.stateObservedAt
        - name: Interval
          type: string
          jsonPath: .spec.interval
        - name: Threshold
          type: number
          jsonPath: .spec.threshold
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [interval, threshold, thresholdType]
              # One source per Alert: it counts log rows (where) or aggregates a metric (metricRef),
              # never both. Enforced at admission rather than discovered at evaluation.
              x-kubernetes-validations:
                - rule: "!has(self.metricRef) || self.where == ''"
                  message: "metricRef and where are mutually exclusive: an Alert counts log rows (where) or aggregates a metric (metricRef), never both"
                - rule: "has(self.aggregation) == (has(self.metricRef) || has(self.value))"
                  message: "aggregation is required with metricRef or value, and only valid with one of them"
                - rule: "!(has(self.metricRef) && has(self.value))"
                  message: "value is read from log rows; a metric alert (metricRef) aggregates the metric itself"
                - rule: "!has(self.aggregation) || self.aggregation != 'increase' || has(self.metricRef)"
                  message: "aggregation 'increase' is a counter metric's; it requires metricRef"
                - rule: "!has(self.labels) || has(self.metricRef)"
                  message: "labels filter a metric's points; they require metricRef"
                - rule: "has(self.thresholdMax) == (has(self.thresholdType) && self.thresholdType in ['between', 'not_between'])"
                  message: "thresholdMax is the upper bound of a range: required with thresholdType between or not_between, and only valid with them"
                - rule: "!has(self.thresholdMax) || double(self.thresholdMax) >= double(self.threshold)"
                  message: "thresholdMax must be at least threshold: the range is [threshold, thresholdMax]"
                - rule: "!has(self.ratio) || has(self.metricRef)"
                  message: "ratio divides two totals of a metric; it requires metricRef"
                - rule: "!has(self.ratio) || (has(self.aggregation) && self.aggregation in ['sum', 'increase'])"
                  message: "ratio divides two totals: aggregation must be sum or increase"
                - rule: "!has(self.source) || !has(self.metricRef)"
                  message: "source names the rows where reads (logs or traces); a metric alert (metricRef) reads its metric"
                - rule: "!has(self.source) || self.source != 'traces' || self.where != ''"
                  message: "a traces alert needs a where: counting every span measures traffic, not a fault"
                - rule: "!has(self.groupBy) || has(self.metricRef)"
                  message: "groupBy splits a metric's series; it requires metricRef"
                - rule: "!has(self.groupBy) || !has(self.ratio)"
                  message: "groupBy and ratio are mutually exclusive: a grouped ratio would need both its totals grouped alike"
                # HyperDX 2.35 pastes a grouped increase's groupBy, as one string, into the TopGroups
                # ranking's tuple() and a toString() null filter
                # (common-utils/src/core/renderChartConfig.ts:1949-2007): an alias there is a syntax
                # error by HyperDX's own comment, and several keys do not render. Refused until proven.
                - rule: "!has(self.groupBy) || !has(self.aggregation) || self.aggregation != 'increase'"
                  message: "groupBy does not support aggregation increase yet: HyperDX 2.35 renders the group into tuple() and toString() (renderChartConfig.ts:1949-2007), where an alias is a syntax error and several keys do not render. On a counter, aggregation sum totals the same per-interval deltas and groups"
                # HyperDX's notification text is the description, a blank line ("\n\n") and the
                # runbook, and @hyperdx/api@2.35.0 refuses a message over 4096 characters
                # (api/src/utils/zod.ts alertSchema: z.string().min(1).max(4096)). Without a
                # description the default text is at most 336 characters, which runbook's maxLength
                # already fits. CEL counts code points and zod UTF-16 units, so a character outside
                # the BMP (an emoji) counts once here and twice in HyperDX.
                - rule: "!has(self.runbook) || !has(self.description) || size(self.runbook) == 0 || size(self.description) + 2 + size(self.runbook) <= 4096"
                  message: "description and runbook together exceed HyperDX's 4096 characters for a notification text (description, a blank line, runbook): shorten the runbook"
              properties:
                displayName:
                  type: string
                  description: >
                    Human-readable name, shown in the portal and in the RCA prompt (defaults to
                    metadata.name). It need not be unique: the HyperDX alert is named after
                    metadata.name, which its webhook carries back to identify this CR.
                source:
                  type: string
                  enum: [logs, traces]
                  description: >
                    Which rows where and value read: the HyperDX logs source (logs, the default when
                    omitted) or its traces source (traces, one row per span, with columns such as
                    ServiceName, SpanName, StatusCode, StatusMessage, Duration and SpanAttributes).
                    Row alerts only: refused with metricRef. A traces alert needs a non-empty where.
                where:
                  type: string
                  default: ""
                  description: >
                    ClickHouse SQL boolean expression over the rows of source counted by the alert
                    (empty = all rows). The controller pins whereLanguage:"sql" on the tile, and the
                    expression reaches the query's WHERE clause verbatim. In the logs source,
                    severity travels in the text rather than in a severity column, so predicates
                    read off Body and, for Kubernetes events, the JSON inside it — e.g.
                    ResourceAttributes['telemetry.source'] = 'k8s-events' AND
                    JSONExtractString(Body, 'object', 'reason') = 'BackOff'. In the traces source,
                    predicates read the span — e.g. ServiceName = 'snowplow' AND StatusCode =
                    'Error'.
                metricRef:
                  type: object
                  required: [name]
                  description: >
                    The Metric (metrics.observability.krateo.io), in the Alert's namespace, the
                    alert aggregates over the metrics source, instead of counting log rows.
                    Mutually exclusive with a non-empty where; requires aggregation. A reference to
                    a Metric that does not exist is refused with phase: Invalid.
                  properties:
                    name:
                      type: string
                      minLength: 1
                aggregation:
                  type: string
                  enum: [avg, max, min, sum, p95, increase]
                  description: >
                    How the points over the interval become the value compared with the threshold:
                    the metric's (metricRef), or value's per log row. 'increase' is a counter's (a
                    sum metric's) increase over the interval, with counter resets clamped so a
                    restart neither spikes nor goes negative; it is metric-only and refused on any
                    other metric type.
                value:
                  type: string
                  description: >
                    A ClickHouse SQL expression read from each row (of source) that where matches,
                    aggregated by aggregation instead of counting the rows — e.g. a cost extracted
                    from a log row's Body:
                    toFloat64OrZero(extract(Body, 'agw\\.ai\\.usage\\.cost\\.total=([0-9.]+)')),
                    or a span's duration in milliseconds: Duration / 1e6.
                    Requires aggregation (avg, max, min, sum or p95). Row alerts only.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  x-kubernetes-validations:
                    - rule: "self.all(k, k.matches('^[A-Za-z0-9_./-]+$'))"
                      message: "label keys are attribute names: letters, digits, '_', '.', '-', '/'"
                  description: >
                    Keep only the metric points that carry these values, on the point or on its
                    resource, e.g. {tenant: acme}; ANDed together. Metric alerts only. With ratio,
                    these select the numerator.
                ratio:
                  type: object
                  description: >
                    Compare a share instead of one total: the aggregation of the points labels
                    keep (the numerator) divided by the aggregation of the points ratio.labels
                    keep (the denominator), both from the metric, over the interval. E.g. the
                    failing share of API requests: labels {krateo.sli.error: "true"},
                    ratio.labels {service.name: snowplow}, threshold 0.01 above. HyperDX evaluates
                    a window with no traffic as 0, so a ratio whose condition holds at 0 (e.g. a
                    success share 'below 0.99') would fire whenever the service is idle; such an
                    Alert is refused (phase Invalid). Metric alerts with aggregation sum or
                    increase only.
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      x-kubernetes-validations:
                        - rule: "self.all(k, k.matches('^[A-Za-z0-9_./-]+$'))"
                          message: "label keys are attribute names: letters, digits, '_', '.', '-', '/'"
                      description: The denominator's points, ANDed; empty keeps every point of the metric.
                interval:
                  type: string
                  enum: ["1m", "5m", "15m", "30m", "1h", "6h", "12h", "1d"]
                  default: "5m"
                  description: Evaluation window.
                threshold:
                  type: number
                  description: >
                    Trigger value compared via thresholdType. For a log alert (where) the value is
                    a COUNT of rows over the window, so it is never negative — which makes some
                    pairings decided before any data is read and rejected by the controller with
                    phase: Invalid: 'above 0' (value >= 0) fires on every evaluation including an
                    empty result, and 'below 0' (value < 0) can never fire at all. Use 1 with
                    'above' for "at least one", and 1 with 'below' for "none in this window". For an
                    aggregated alert (metricRef, or value) the compared value is the aggregation
                    over the window, in its own unit, and any threshold is accepted.
                thresholdType:
                  type: string
                  enum: [above, below, above_exclusive, below_or_equal, equal, not_equal, between, not_between]
                  default: above
                  description: >
                    How the value is compared with threshold (HyperDX's doesExceedThreshold): above
                    is value >= threshold, above_exclusive >, below <, below_or_equal <=, equal ==,
                    not_equal !=; between fires on threshold <= value <= thresholdMax, not_between
                    outside that range.
                thresholdMax:
                  type: number
                  description: >
                    The upper bound of the range for thresholdType between and not_between
                    (required with them, refused otherwise); at least threshold.
                description:
                  type: string
                  description: >
                    One plain sentence saying what the alert catches, shown in the portal. The
                    investigation reads it as the alert's intent, and HyperDX sends it as the
                    notification text.
                runbook:
                  type: string
                  # 3072 leaves at least 1022 characters of HyperDX's 4096 for the description (a
                  # sentence), and fits under the default text an Alert without a description gets
                  # (at most 336 characters, alert.go fields and hyperdx.go alertBody). Longer
                  # guidance is a manual: link it.
                  maxLength: 3072
                  description: >
                    Operator guidance for when the alert fires (markdown): what to check, and what
                    never to do. Not shown in the portal. HyperDX sends it after the description,
                    a blank line between them, so with the description it must fit HyperDX's 4096
                    characters for a notification text. HyperDX renders that text as a Handlebars
                    template and reads a word starting with "@" as a notification channel, so
                    write neither a double opening brace nor such a word. The investigation reads
                    it as operator guidance before it proposes a fix.
                groupBy:
                  type: array
                  minItems: 1
                  maxItems: 5
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: '^[A-Za-z0-9_./-]+$'
                    # The tile aliases each key as itself (`<expr> AS `<key>``), and ClickHouse
                    # resolves an alias before a column of the same name (case-sensitively), so a
                    # key named after an identifier in scope where HyperDX 2.35 renders the tile's
                    # groupBy would replace that column, or clash with an alias of the same name.
                    # The names, from @hyperdx/api@2.35.0:
                    #   gauge, outer query FROM Bucketed (common-utils/src/core/renderChartConfig.ts):
                    #     __hdx_time_bucket2 (:1703, the bucket alias), AttributesHash (:1746,
                    #     :1756), LastValue (:1757), ScopeAttributes (:1758), ResourceAttributes
                    #     (:1759), Attributes (:1760), ResourceSchemaUrl (:1761), ScopeName
                    #     (:1762), ScopeVersion (:1763), ScopeDroppedAttrCount (:1764),
                    #     ScopeSchemaUrl (:1765), ServiceName (:1766), MetricDescription (:1767),
                    #     MetricUnit (:1768), StartTimeUnix (:1769), Flags (:1770); and the outer
                    #     time bucket __hdx_time_bucket (:80, the default alias at :831).
                    #   sum, outer query FROM Bucketed (renderChartConfig.ts:1882-1902):
                    #     the same, plus Rate (:1885), Sum (:1886), MetricName (:1895),
                    #     AggregationTemporality (:1901), IsMonotonic (:1902); the outer value
                    #     alias Value (:2019, :2027, :2033); with increase, the TopGroups CTE's
                    #     group (:1986) and bucket_value (:1987).
                    #   histogram (p95), innermost select over otel_metrics_histogram
                    #     (common-utils/src/core/histogram.ts:185-197): every column of the
                    #     table (docker/otel-collector/schema/seed/00003_otel_metrics.sql:83-109,
                    #     which adds TimeUnix, Count, BucketCounts, ExplicitBounds, Min, Max and
                    #     the Exemplars.* columns), and that select's group (:191), attr_hash
                    #     (:192), bounds_hash (:193), counts (:194).
                    # A metric Alert never sends count on a histogram, and the API offers no
                    # exponential histogram or summary, so those paths add nothing.
                    x-kubernetes-validations:
                      - rule: '!(self in ["AggregationTemporality", "Attributes", "AttributesHash", "BucketCounts", "Count",
                          "Exemplars.FilteredAttributes", "Exemplars.SpanId", "Exemplars.TimeUnix",
                          "Exemplars.TraceId", "Exemplars.Value", "ExplicitBounds", "Flags", "IsMonotonic",
                          "LastValue", "Max", "MetricDescription", "MetricName", "MetricUnit", "Min", "Rate",
                          "ResourceAttributes", "ResourceSchemaUrl", "ScopeAttributes", "ScopeDroppedAttrCount",
                          "ScopeName", "ScopeSchemaUrl", "ScopeVersion", "ServiceName", "StartTimeUnix", "Sum",
                          "TimeUnix", "Value", "__hdx_time_bucket", "__hdx_time_bucket2", "attr_hash",
                          "bounds_hash", "bucket_value", "counts", "group"])'
                        messageExpression: >-
                          'groupBy key ' + self + ' is refused: it is a column name of the HyperDX
                          metric query, and the tile aliases each key as itself, so this key
                          would shadow that column.'
                  description: >
                    Evaluate one series per distinct value of these attribute keys, e.g.
                    [k8s.namespace.name, k8s.pod.name, k8s.container.name]: one unhealthy container
                    fires however many healthy ones there are. Each key is read off the metric
                    point, or off its resource when the point lacks it, as labels match. HyperDX
                    evaluates each series on its own, counts consecutiveWindows per series, and
                    resolves a series on one interval within the threshold; a series that stops
                    reporting is never resolved by HyperDX, so status.groups (computed by the
                    provider) is the per-series truth. Metric alerts only; refused with ratio and
                    with aggregation increase, and a histogram Metric's Alert is Invalid with it. A
                    key that is a column name of HyperDX's metric query (Attributes, Value,
                    ServiceName, ...) is refused: the tile aliases each key as itself.
                consecutiveWindows:
                  type: integer
                  minimum: 1
                  maximum: 60
                  description: >
                    Fire only once the condition has held for this many consecutive intervals (1
                    when omitted); HyperDX counts them per group with groupBy. An interval with no
                    data restarts the count, and one interval within the threshold resolves.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: >
                    Ready and Synced, written by provider-runtime, and OpensIncidents, written by the
                    provider each pass: True (reason CountsRecords) when a firing opens an incident,
                    False when it does not, with reason OutsideHomeNamespace, AggregatedValue or
                    Paused, in that order of precedence, and a message saying why.
                  items:
                    type: object
                    required: [lastTransitionTime, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                hyperdxAlertId:
                  type: string
                hyperdxDashboardId:
                  type: string
                state:
                  type: string
                  description: Live HyperDX alert state (OK / ALERT / PENDING).
                stateObservedAt:
                  type: string
                  format: date-time
                  description: >
                    When the provider last read the live HyperDX state into state, set on every
                    pass that reads it. A provider that is down leaves Ready as it was; only this
                    stamp grows old.
                okSince:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    When the alert last turned OK; unset while state is anything but OK. Written
                    by the loop that writes state, for display only: it never closes an incident.
                phase:
                  type: string
                  description: >
                    Reconcile phase. Pending (no HyperDX alert yet) / Invalid (the threshold can only
                    have one outcome — see threshold — or the metricRef names no Metric, or its
                    aggregation cannot apply to the Metric's type) / Synced (the CR's spec IS the
                    live alert) / SpecDrift (the spec could not be pushed — the live alert does
                    NOT match this CR) / Error.
                type:
                  type: string
                  enum: [Logs, Traces, Metric, LogValue, TraceValue]
                  description: >
                    What the alert evaluates, from its spec: a count of log rows (Logs) or spans
                    (Traces), a metric (Metric), or a value read from log rows (LogValue) or spans
                    (TraceValue). Only Logs and Traces alerts open incidents (see the OpensIncidents
                    condition).
                error:
                  type: string
                groups:
                  type: array
                  description: >
                    With groupBy: the series that are ALERT, computed by the provider each pass from
                    consecutiveWindows completed intervals judged one interval late: the newest
                    completed interval may not be ingested yet, so it is left out, and this list may
                    trail HyperDX's own state by one interval, on purpose. A series is listed only
                    when every one of those intervals has a value that breaches the threshold. A
                    series that recovers or stops reporting drops out. Sorted by group; at most 50, the rest
                    counted in groupsTruncated. Left as it was when the query fails.
                  items:
                    type: object
                    required: [group, value, since]
                    properties:
                      group:
                        type: object
                        additionalProperties:
                          type: string
                        description: The series' value of each groupBy key.
                      value:
                        type: number
                        description: The series' value in the last completed interval.
                      since:
                        type: string
                        format: date-time
                        description: >
                          When the series started breaching: the start of the earliest breaching
                          interval, kept while the series stays listed.
                groupsTruncated:
                  type: integer
                  description: ALERT series left out of groups past its 50 entries.
