# A minimal Incident CRD for the reanalysis watch's tests: incident-provider's group, version and
# kind, a status subresource (so a status write leaves metadata.generation alone, as on a real
# cluster), and open schemas. The real CRD lives in incident-provider.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: incidents.observability.krateo.io
spec:
  group: observability.krateo.io
  names: {kind: Incident, listKind: IncidentList, plural: incidents, singular: incident}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
